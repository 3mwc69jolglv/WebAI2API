[package]
name = "aiweb2api"
version = "0.1.0"
edition = "2021"
description = "API mandiri yang kompatibel OpenAI di atas akun web ChatGPT, Claude, Gemini, dan Grok (autentikasi via cookie)."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
regex = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = "0.4"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
sha3 = "0.10"
